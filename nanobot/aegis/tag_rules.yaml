rules:
  # Credential and secret file access
  - name: detect_dotenv_file
    tool_name_pattern: "read_file"
    arg_key: "path"
    arg_pattern: "\\.env"
    tags:
      - credentials
      - secrets

  - name: detect_dotenv_local
    tool_name_pattern: "read_file"
    arg_key: "path"
    arg_pattern: "\\.env\\.local"
    tags:
      - credentials
      - secrets

  - name: detect_config_secrets
    tool_name_pattern: "read_file"
    arg_key: "path"
    arg_pattern: "secrets"
    tags:
      - secrets

  - name: detect_ssh_key_file
    tool_name_pattern: "read_file"
    arg_key: "path"
    arg_pattern: "\\.ssh"
    tags:
      - credentials
      - pii

  # Private key detection in results
  - name: detect_private_key_in_result
    result_pattern: "BEGIN.*PRIVATE KEY"
    tags:
      - credentials
      - pii

  - name: detect_api_key_in_result
    result_pattern: "(?i)api[_-]?key\\s*[:=]"
    tags:
      - credentials

  # Shell execution tracking
  - name: track_shell_exec
    tool_name_pattern: "exec_shell"
    arg_key: "command"
    arg_pattern: ".*"
    tags:
      - shell_exec

  # Credential files written
  - name: detect_credential_write
    tool_name_pattern: "write_file"
    arg_key: "path"
    arg_pattern: "\\.env"
    tags:
      - credentials
      - secrets
