metadata:
  id: data_exfiltration
  name: data_exfiltration
  description: Block messaging and web requests after sensitive data has been accessed
  version: 1
  created_at: "2026-03-17T00:00:00+00:00"
  updated_at: "2026-03-17T00:00:00+00:00"
  created_by: nanobot
  source_guidance: null
  status: active
  enforcement_points:
    - pre_call
  priority: 10
  tags:
    - data_protection
  applicable_tools:
    - send_message
    - web_fetch
    - web_search
  applicable_tags:
    - credentials
    - secrets
    - pii

dsl: |
  policy "data_exfiltration" {
    description: "Block messaging and web requests after sensitive data has been accessed"
    enforcement: [PRE_CALL]
    applies_to: ["send_message", "web_fetch", "web_search"]
  }

  rule "allow_audit_sessions" {
    ctx.session.purpose_tags.any_of(["audit", "trusted", "reporting"])
    => ALLOW
    reason: "Audit and trusted sessions may send messages after sensitive data access"
  }

  // Allowlist for web_fetch: add trusted domains using starts_with or matches.
  // Only web_fetch passes a "url" arg pre-call; send_message/web_search are unaffected.
  // Example: ctx.tool.args.url.starts_with("https://internal.corp.example.com")
  //       OR ctx.tool.args.url.matches("https://api\\.trusted\\.example\\.com/.*")
  rule "allow_trusted_web_fetch" {
    ctx.tool.args.url.starts_with("https://www.linkedin.com")
    OR ctx.tool.args.url.starts_with("https://linkedin.com")
    OR ctx.tool.args.url.starts_with("https://www.google.com")
    OR ctx.tool.args.url.starts_with("https://google.com")
    => ALLOW
    reason: "URL is on the trusted allowlist"
  }

  rule "deny_messaging_after_credentials" {
    ctx.session.tags.any_of(["credentials", "secrets"])
    => DENY
    reason: "Cannot send messages or make web requests after accessing credentials or secrets"
  }

  rule "deny_messaging_after_pii" {
    ctx.session.tags.any_of(["pii"])
    => DENY
    reason: "Cannot send messages or make web requests after accessing PII"
  }
