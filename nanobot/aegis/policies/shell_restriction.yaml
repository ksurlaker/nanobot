metadata:
  id: shell_restriction
  name: shell_restriction
  description: Deny dangerous shell commands that could harm the system or exfiltrate data
  version: 1
  created_at: "2026-03-17T00:00:00+00:00"
  updated_at: "2026-03-17T00:00:00+00:00"
  created_by: nanobot
  source_guidance: null
  status: active
  enforcement_points:
    - pre_call
  priority: 10
  tags:
    - shell_safety
  applicable_tools:
    - exec_shell
  applicable_tags: []

dsl: |
  policy "shell_restriction" {
    description: "Deny dangerous shell commands that could harm the system or exfiltrate data"
    enforcement: [PRE_CALL]
    applies_to: ["exec_shell"]
  }

  rule "allow_trusted_session" {
    ctx.session.purpose_tags.any_of(["admin", "trusted"])
    => ALLOW
    reason: "Trusted sessions may run any shell command"
  }

  rule "deny_recursive_delete" {
    ctx.tool.args.command.contains("rm -rf")
    => DENY
    reason: "Recursive delete commands are not allowed"
  }

  rule "deny_fork_bomb" {
    ctx.tool.args.command.contains(":(){ :|:& };:")
    => DENY
    reason: "Fork bombs are not allowed"
  }
